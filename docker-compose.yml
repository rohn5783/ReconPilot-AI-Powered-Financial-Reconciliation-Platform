services:
  postgres:
    image: postgres:16-alpine
    container_name: reconpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconpilot
      POSTGRES_USER: reconpilot
      POSTGRES_PASSWORD: reconpilot_secret
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconpilot -d reconpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reconpilot-net

  redis:
    image: redis:7-alpine
    container_name: reconpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reconpilot-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: reconpilot-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,http://frontend"
      DATABASE_URL: "postgres://reconpilot:reconpilot_secret@postgres:5432/reconpilot?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      MOCK_MODE: "false"
      # Insert your Google Gemini API Key here for live GenAI threat synthesis
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      AUTH_API_KEY: "${AUTH_API_KEY:-reconpilot-secret-dev-key}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reconpilot-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: reconpilot-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - reconpilot-net

networks:
  reconpilot-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

