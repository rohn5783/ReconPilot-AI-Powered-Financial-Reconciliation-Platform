services:
  postgres:
    image: postgres:16-alpine
    container_name: reconpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reconpilot
      POSTGRES_PASSWORD: reconpilot
      POSTGRES_DB: reconpilot
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconpilot -d reconpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reconpilot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://reconpilot:reconpilot@postgres:5432/reconpilot?sslmode=disable
      MOCK_MODE: "false"
      AUTO_SEED_ON_EMPTY: "${AUTO_SEED_ON_EMPTY:-false}"
      AUTH_API_KEY: "${AUTH_API_KEY:-}"
      CONTRACT_FEE_RATE: "${CONTRACT_FEE_RATE:-0.0200}"
      CONTRACT_TAX_RATE: "${CONTRACT_TAX_RATE:-0.1800}"
      FEE_TOLERANCE: "${FEE_TOLERANCE:-0.0100}"
      PIPELINE_MAX_CONCURRENT_BATCHES: 10
      PIPELINE_STAGE_TIMEOUT: 5m
      PIPELINE_RING_BUFFER_SIZE_KB: 2048
      SECURITY_ENFORCE_STRICT_SCHEMA: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reconpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local

